name: daily-briefing

# 每天早上 06:1x 北京时间发一封"每日成长简报"，跑在 GitHub 云端，不依赖 Mac。
#
# 可靠性设计（GitHub cron 在整点 :00 拥堵、低活跃仓库还会被静默跳过）：
#   1) 避开整点，并在同一个 UTC 日内排 3 次（06:17/06:32/06:47 CST = 22:17/22:32/22:47 UTC）
#   2) 不加 --force，靠 brain/output/.send_state.json 当日去重 → 多次触发也只发 1 封
#   3) 每次跑完 commit 回仓，保持仓库活跃，让 cron 长期可靠
# 注意：3 个时刻都落在同一 UTC 日（22:xx），去重才不会跨日失效。
on:
  workflow_dispatch:
    inputs:
      force:
        description: "强制发送（忽略当日去重）"
        type: boolean
        default: true
  schedule:
    - cron: "17 22 * * *"   # 06:17 CST
    - cron: "32 22 * * *"   # 06:32 CST
    - cron: "47 22 * * *"   # 06:47 CST

permissions:
  contents: write          # 需要 commit wiki/log + 简报存档回仓

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLM_CHAIN: ${{ secrets.LLM_CHAIN }}
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
      IMAP_HOST: ${{ secrets.IMAP_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 发每日成长简报
        # 定时触发：靠当日去重（多个 cron 时刻只发 1 封）；手动触发：默认 --force 强发
        run: python brain/daily_briefing.py ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}

      - name: commit 简报存档 + wiki/log（保持仓库活跃 → cron 可靠）
        run: |
          git config user.name  "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          # 用 -A 加整个 brain/（.env 已被 gitignore 排除）；避免显式列不存在的文件(如未生成的
          # progress-log.md)导致 git add 整体失败、什么都不提交 → 去重状态丢失会重复发信
          git add -A brain/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变化，跳过提交。"
          else
            git commit -m "chore(brain): 每日简报 $(date -u +%Y-%m-%d) [skip ci]"
            git pull --rebase --autostash origin main || true
            git push || echo "push 失败（不阻断）"
          fi
